<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Area Calculator</title>
</head>
<body>
    <h1>Rectangle Area Calculator </h1>
    <label for="length">Enter the length: </label>
    <input type="number" id="length"><br><br>

    <label for="width">Enter the width: </label>
    <input type="number" id="width"><br><br>

    <button onclick="calculateArea()">Calculate Area</button><br><br>

    <p id="result"></p>
    <h1>Grocery Tracker</h1>
    <label for="item1">Item 1: </label>
    <input type="text" id="item1">
    <input type="number" id="item1price"><br><br>

    <label for="item2">Item 2: </label>
    <input type="text" id="item2">
    <input type="number" id="item2price"><br><br>

    <label for="item3">Item 3: </label>
    <input type="text" id="item3">
    <input type="number" id="item3price"><br><br>

    <label for="item4">Item 4: </label>
    <input type="text" id="item4">
    <input type="number" id="item4price"><br><br>

    <button onclick="calculateTotal()">Caculate Total</button><br>
    <p id="grocerytotal"></p>
    <script src="./calculate_area.js"></script>
</body>
</html>
